      "żaden z powyższych"
    ],
    "correct": 3
  },
  {
    "q": "Drogi piramidowe należą do dróg:",
    "a": [
      "własnych rdzenia kręgowego",
      "rdzeniowo-mózgowe",
      "c)mózgowo-rdzeniowych",
      "rdzeniowo-opuszkowych",
      "žadne"
    ],
    "correct": 2
  },
  {
    "q": "Klinicznie do pnia mózgu nie zaliczamy",
    "a": [
      "mostu",
      "śródmózgowia",
      "rdzenie przedłuzonego",
      "kresomózgowia",
      "Zadne"
    ],
    "correct": 3
  }
];
const $=id=>document.getElementById(id);let deck=[],pos=0,score=0,chosen=null,mistakes=[];
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(which){['start','play','finish'].forEach(id=>$(id).classList.toggle('hidden',id!==which))}
function begin(){let n=$('count').value;deck=shuffle(BANK.filter(q=>!q.excluded)).slice(0,n==='all'?BANK.filter(q=>!q.excluded).length:Number(n)).map(q=>{let opts=shuffle(q.a.map((text,i)=>({text,correct:i===q.correct})));return {...q,opts}});pos=0;score=0;mistakes=[];show('play');render()}
function render(){chosen=null;const q=deck[pos];$('number').textContent=`Pytanie ${pos+1} z ${deck.length}`;$('points').textContent=`Punkty: ${score}`;$('fill').style.width=`${pos/deck.length*100}%`;$('question').textContent=q.q;$('next').disabled=true;$('next').textContent=pos===deck.length-1?'Zobacz wynik →':'Następne pytanie →';$('feedback').className='feedback hidden';$('sourceNote').textContent=q.note?'Uwaga o źródle: '+q.note:'';$('sourceNote').classList.toggle('hidden',!q.note);$('answers').replaceChildren();q.opts.forEach((op,i)=>{const btn=document.createElement('button');btn.className='answer';btn.innerHTML=`<span class="letter">${'ABCDE'[i]}</span>`;const text=document.createElement('span');text.textContent=op.text;btn.append(text);btn.addEventListener('click',()=>pick(i));$('answers').append(btn)})}
function pick(i){if(chosen!==null)return;chosen=i;const q=deck[pos],correct=q.opts[i].correct;score+=Number(correct);if(!correct)mistakes.push({question:q.q,yours:q.opts[i].text,right:q.opts.find(x=>x.correct).text});const btns=[...$('answers').children];btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('points').textContent=`Punkty: ${score}`;$('feedback').textContent=correct?'Świetnie! Poprawna odpowiedź.':`Poprawna odpowiedź: ${q.opts.find(x=>x.correct).text}`;$('feedback').className='feedback '+(correct?'ok':'no');$('next').disabled=false}
function advance(){if(chosen===null)return;if(++pos<deck.length)render();else finish()}
function finish(){show('finish');$('finalScore').textContent=`${score} / ${deck.length}`;$('summary').textContent=`Wynik: ${Math.round(score/deck.length*100)}% poprawnych odpowiedzi.`;$('review').classList.add('hidden');$('review').replaceChildren();$('reviewBtn').disabled=mistakes.length===0;$('reviewBtn').textContent=mistakes.length?`Pokaż błędy (${mistakes.length})`:'Bez błędów!';mistakes.forEach(m=>{const div=document.createElement('div');div.className='review-item';const strong=document.createElement('strong');strong.textContent=m.question;const wrong=document.createElement('div');wrong.textContent='Twoja odpowiedź: '+m.yours;const right=document.createElement('div');right.textContent='Poprawna: '+m.right;div.append(strong,wrong,right);$('review').append(div)})}
$('startBtn').addEventListener('click',begin);$('next').addEventListener('click',advance);$('again').addEventListener('click',()=>show('start'));$('reviewBtn').addEventListener('click',()=>$('review').classList.toggle('hidden'));
</script></body></html>
