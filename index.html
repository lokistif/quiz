<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagel Quiz – Anatomia (Układ pokarmowy)</title>

<style>
:root {
  --bg: #fffaf0;
  --card: #fffdf8;
  --text: #473629;
  --accent: #df8c43;
  --border: #edd7b8;
  --green: #317655;
  --red: #a64545;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

main {
  max-width: 750px;
  padding: 20px 15px;
  margin: 20px auto;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

h1 {
  color: var(--accent);
  font-size: clamp(35px, 7vw, 55px);
  margin: 5px 0;
}

.subtitle { color: #88745f; }

.bagels { font-size: 55px; }

.panel {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 22px;
  padding: 28px;
  box-shadow: 0 10px 30px #6b49191a;
}

.hidden { display: none !important; }

button, select {
  font: inherit;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 13px 17px;
}

button {
  background: white;
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
}

button:hover:not(:disabled) {
  background: #fff1dc;
}

button:disabled {
  opacity: .5;
  cursor: default;
}

.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.primary:hover:not(:disabled) {
  background: #c87530;
  color: white;
}

.center { text-align: center; }

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 25px 0;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
}

.bar {
  height: 10px;
  background: #f3e5d1;
  border-radius: 20px;
  margin: 15px 0 28px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width .3s;
}

#question {
  font-size: 24px;
  line-height: 1.4;
  margin-bottom: 25px;
}

.answers {
  display: grid;
  gap: 12px;
}

.answer {
  width: 100%;
  display: flex;
  align-items: center;
  text-align: left;
  gap: 12px;
  padding: 16px;
  line-height: 1.4;
}

.letter {
  background: #f8e5c8;
  color: #9b652f;
  padding: 8px 12px;
  border-radius: 9px;
  font-weight: 800;
  flex-shrink: 0;
}

.answer.correct {
  background: #e5f4e9;
  border-color: var(--green);
}

.answer.wrong {
  background: #fbe9e7;
  border-color: var(--red);
}

.feedback {
  margin-top: 20px;
  font-weight: 600;
}

.feedback.ok { color: var(--green); }
.feedback.no { color: var(--red); }

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-top: 28px;
}

.score {
  font-size: 55px;
  font-weight: 800;
  color: var(--accent);
}

.review {
  text-align: left;
  margin-top: 20px;
  max-height: 400px;
  overflow-y: auto;
}

.review-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.review-item strong {
  display: block;
  margin-bottom: 8px;
}

footer {
  text-align: center;
  color: #88745f;
  font-size: 12px;
  margin-top: 30px;
}

@media(max-width: 500px) {
  .panel { padding: 20px; }
  #question { font-size: 21px; }
  .bottom { flex-direction: column; }
  .bottom button { width: 100%; }
}
</style>
</head>

<body>
<main>

<header>
  <div class="bagels">🥯🥯🥯</div>
  <h1>Bagel Quiz!</h1>
  <div class="subtitle">Anatomia – układ pokarmowy</div>
</header>

<section class="panel" id="start">
  <h2 class="center">Gotowy na quiz?</h2>
  <p class="center">
    Sprawdź swoją wiedzę z anatomii układu pokarmowego!
  </p>

  <div class="controls">
    <label for="count">Liczba pytań:</label>
    <select id="count">
      <option value="10">10 pytań</option>
      <option value="20">20 pytań</option>
      <option value="all">Wszystkie pytania (65)</option>
    </select>
  </div>

  <div class="center">
    <button class="primary" id="startBtn">
      Rozpocznij quiz →
    </button>
  </div>
</section>

<section class="panel hidden" id="play">
  <div class="row">
    <span id="number"></span>
    <span id="points"></span>
  </div>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <h2 id="question"></h2>

  <div id="answers" class="answers"></div>

  <div id="feedback" class="feedback hidden"></div>

  <div class="bottom">
    <span>Wybierz jedną odpowiedź</span>
    <button class="primary" id="next" disabled>
      Następne pytanie →
    </button>
  </div>
</section>

<section class="panel hidden center" id="finish">
  <h2>Koniec quizu! 🎉</h2>

  <div id="finalScore" class="score"></div>
  <p id="summary"></p>

  <div class="controls">
    <button class="primary" id="again">
      Zagraj ponownie
    </button>
    <button id="reviewBtn">
      Pokaż błędy
    </button>
  </div>

  <div id="review" class="review hidden"></div>
</section>

<footer>
  Bagel Quiz • Anatomia • Układ pokarmowy
</footer>

</main>

  {"q":"Czym pokryta jest sieć większa?","a":["jest bogato otłuszczona","jest całkowicie pozbawiona tkanki tłuszczowej","jest pokryta chrząstką szklistą","jest wyścielona nabłonkiem wielowarstwowym płaskim rogowaciejącym"],"correct":0},
  {"q":"Czym jest hepatomegalia, a czym hepatosplenomegalia?","a":["hepatomegalia – powiększenie wątroby; hepatosplenomegalia – powiększenie wątroby i śledziony","hepatomegalia – powiększenie śledziony; hepatosplenomegalia – powiększenie trzustki i wątroby","hepatomegalia – zanik wątroby; hepatosplenomegalia – zapalenie pęcherzyka żółciowego","hepatomegalia – powiększenie wątroby i nerek; hepatosplenomegalia – powiększenie śledziony"],"correct":0},
  {"q":"Jakie są cechy charakterystyczne dla jelita grubego?","a":["fałdy półksiężycowate, taśmy (swobodna, sieciowa i krezkowa) oraz przyczepki sieciowe","kosmki jelitowe i brak taśm mięśniowych","obecność uchyłka Meckela na całej długości","brak błony podśluzowej i brak taśm"],"correct":0},

];

const $ = id => document.getElementById(id);

let deck = [];
let pos = 0;
let score = 0;
let chosen = null;
let mistakes = [];

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function show(section) {
  ["start", "play", "finish"].forEach(id => {
    $(id).classList.toggle("hidden", id !== section);
  });
}

function begin() {
  const count = $("count").value;

  const number = count === "all"
    ? BANK.length
    : Number(count);

  deck = shuffle(BANK)
    .slice(0, number)
    .map(q => ({
      ...q,
      opts: shuffle(q.a.map((text, i) => ({
        text,
        correct: i === q.correct
      })))
    }));

  pos = 0;
  score = 0;
  mistakes = [];

  show("play");
  render();
}

function render() {
  chosen = null;

  const q = deck[pos];

  $("number").textContent =
    `Pytanie ${pos + 1} z ${deck.length}`;

  $("points").textContent = `Punkty: ${score}`;

  $("fill").style.width =
    `${(pos / deck.length) * 100}%`;

  $("question").textContent = q.q;

  $("next").disabled = true;

  $("next").textContent =
    pos === deck.length - 1
      ? "Zobacz wynik →"
      : "Następne pytanie →";

  $("feedback").className = "feedback hidden";
  $("answers").replaceChildren();

  q.opts.forEach((option, i) => {
    const button = document.createElement("button");

    button.className = "answer";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = "ABCD"[i];

    const text = document.createElement("span");
    text.textContent = option.text;

    button.append(letter, text);

    button.addEventListener("click", () => pick(i));

    $("answers").append(button);
  });
}

function pick(index) {
  if (chosen !== null) return;

  chosen = index;

  const q = deck[pos];
  const correct = q.opts[index].correct;

  if (correct) {
    score++;
  } else {
    mistakes.push({
      question: q.q,
      yours: q.opts[index].text,
      right: q.opts.find(o => o.correct).text
    });
  }

  [...$("answers").children].forEach((button, i) => {
    button.disabled = true;

    if (q.opts[i].correct) {
      button.classList.add("correct");
    } else if (i === index) {
      button.classList.add("wrong");
    }
  });

  $("points").textContent = `Punkty: ${score}`;

  $("feedback").textContent = correct
    ? "Świetnie! Poprawna odpowiedź."
    : `Poprawna odpowiedź: ${q.opts.find(o => o.correct).text}`;

  $("feedback").className =
    "feedback " + (correct ? "ok" : "no");

  $("next").disabled = false;
}

function advance() {
  if (chosen === null) return;

  pos++;

  if (pos < deck.length) {
    render();
  } else {
    finish();
  }
}

function finish() {
  show("finish");

  $("fill").style.width = "100%";

  $("finalScore").textContent =
    `${score} / ${deck.length}`;

  $("summary").textContent =
    `Wynik: ${Math.round(score / deck.length * 100)}%`;

  $("review").replaceChildren();
  $("review").classList.add("hidden");

  $("reviewBtn").disabled = mistakes.length === 0;

  $("reviewBtn").textContent = mistakes.length
    ? `Pokaż błędy (${mistakes.length})`
    : "Bez błędów!";

  mistakes.forEach(m => {
    const item = document.createElement("div");
    item.className = "review-item";

    const title = document.createElement("strong");
    title.textContent = m.question;

    const wrong = document.createElement("div");
    wrong.textContent = "Twoja odpowiedź: " + m.yours;

    const right = document.createElement("div");
    right.textContent = "Poprawna: " + m.right;

    item.append(title, wrong, right);
    $("review").append(item);
  });
}

$("startBtn").addEventListener("click", begin);
$("next").addEventListener("click", advance);

$("again").addEventListener("click", () => {
  show("start");
});

$("reviewBtn").addEventListener("click", () => {
  $("review").classList.toggle("hidden");
});
</script>
